<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Chatbot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0eff8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 420px;
      height: 580px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e0dff5;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(127, 119, 221, 0.12);
    }

    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid #e0dff5;
      background: #f7f6fe;
    }

    #avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #eeedfe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    #header-text p {
      font-size: 15px;
      font-weight: 600;
      color: #26215c;
    }

    #header-text span {
      font-size: 12px;
      color: #1d9e75;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafafa;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #d0cef5; border-radius: 4px; }

    .msg {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 82%;
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .bubble {
      padding: 9px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
    }

    .user .bubble {
      background: #cecbf6;
      color: #26215c;
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background: #ffffff;
      color: #333;
      border: 1px solid #e0dff5;
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: #aaa;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    #ended-notice {
      display: none;
      text-align: center;
      font-size: 12px;
      color: #999;
      padding: 8px;
      background: #fafafa;
      border-top: 1px solid #e0dff5;
    }

    #input-area {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid #e0dff5;
      background: #ffffff;
      align-items: center;
    }

    #user-input {
      flex: 1;
      padding: 9px 14px;
      font-size: 14px;
      border: 1px solid #d0cef5;
      border-radius: 20px;
      background: #f7f6fe;
      color: #333;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    #user-input:focus { border-color: #7f77dd; }

    #send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #7f77dd;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    #send-btn:hover  { background: #534ab7; }
    #send-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div id="app">
    <div id="header">
      <div id="avatar">🤖</div>
      <div id="header-text">
        <p>Python Chatbot</p>
        <span>● online</span>
      </div>
    </div>

    <div id="messages" role="log" aria-live="polite"></div>

    <div id="ended-notice">Konverzace ukončena. Obnov stránku pro nový chat.</div>

    <div id="input-area">
      <input
        type="text"
        id="user-input"
        placeholder="Napiš zprávu..."
        autocomplete="off"
        aria-label="Tvá zpráva"
      />
      <button id="send-btn" aria-label="Odeslat">
        <i class="ti ti-arrow-up"></i>
      </button>
    </div>
  </div>

  <script>
    const messages    = document.getElementById('messages');
    const input       = document.getElementById('user-input');
    const sendBtn     = document.getElementById('send-btn');
    const endedNotice = document.getElementById('ended-notice');
    const inputArea   = document.getElementById('input-area');

    let ended = false;

    function now() {
      return new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(text, who) {
      const wrap   = document.createElement('div');
      wrap.className = 'msg ' + who;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = now();

      wrap.appendChild(bubble);
      wrap.appendChild(time);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
    }

    function botReply(user) {
      const u = user.toLowerCase();

      if (u === 'konec') {
        addMessage('Ahoj, měj se!', 'bot');
        ended = true;
        inputArea.style.display = 'none';
        endedNotice.style.display = 'block';
        return;
      }

      if      (u.includes('ahoj'))       addMessage('Ahoj! Jak se máš?', 'bot');
      else if (u.includes('jak se máš')) addMessage('Mám se dobře, díky za zeptání!', 'bot');
      else if (u.includes('jméno'))      addMessage('Jsem jednoduchý Python chatbot.', 'bot');
      else if (u.includes('počasí'))     addMessage('Počasí neumím zjistit bez internetu.', 'bot');
      else if (u.includes('pomoc'))      addMessage('Umím reagovat na základní otázky.', 'bot');
      else                               addMessage('Promiň, tomu nerozumím.', 'bot');
    }

    function send() {
      if (ended) return;
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';
      setTimeout(() => botReply(text), 300);
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

    setTimeout(() => {
      addMessage('Ahoj! Jsem jednoduchý chatbot. Napiš "konec" pro ukončení.', 'bot');
    }, 200);
  </script>

</body>
</html>
